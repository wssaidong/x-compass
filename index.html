<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>x-compass · AAna 报告浏览器</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">📊</div>
        <div class="brand">
          <h1>x-compass</h1>
          <p>AAna 报告浏览器 · 6 类报告统一视图</p>
        </div>
      </div>
      <div class="header-right">
        <div class="date-picker">
          <button id="btn-prev" title="前一天">◀</button>
          <input type="date" id="date-input"/>
          <button id="btn-next" title="后一天">▶</button>
          <button id="btn-today" class="today">今天</button>
        </div>
        <span class="last-loaded" id="last-loaded"></span>
      </div>
    </header>

    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="selection">🟢 选股</button>
      <button class="tab-btn" data-tab="review">📊 复盘</button>
      <button class="tab-btn" data-tab="deepdive">🔬 深度</button>
      <button class="tab-btn" data-tab="premarket">🌅 盘前</button>
      <button class="tab-btn" data-tab="auction">⚡ 竞价</button>
      <button class="tab-btn" data-tab="intraday">📈 盘中</button>
    </nav>

    <main>
      <section class="tab-content active" id="content-selection"></section>
      <section class="tab-content" id="content-review"></section>
      <section class="tab-content" id="content-deepdive"></section>
      <section class="tab-content" id="content-premarket"></section>
      <section class="tab-content" id="content-auction"></section>
      <section class="tab-content" id="content-intraday"></section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
