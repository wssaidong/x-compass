<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stock Weekly · 周度综合看板</title>
<style>
:root{
  --bg:#f4f6fb;--surface:#ffffff;--card:#ffffff;--card2:#f8fafc;--border:#e8ecf2;--border2:#dde2ec;
  --accent:#5b5fd6;--accent-light:rgba(91,95,214,0.07);--accent2:#818cf8;
  --green:#10b981;--green-bg:rgba(16,185,129,0.05);
  --red:#ef4444;--red-light:rgba(239,68,68,0.08);
  --yellow:#f59e0b;--yellow-light:rgba(245,158,11,0.08);
  --text:#1a1d2e;--text2:#4b5672;--text3:#8896b3;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,0.04),0 4px 12px rgba(0,0,0,0.04);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.08),0 2px 8px rgba(0,0,0,0.04);
  --shadow-accent:0 4px 16px rgba(91,95,214,0.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}
.container{max-width:1240px;margin:0 auto;padding:2.5rem 2rem 4rem}
.hidden{display:none!important}
.header{position:sticky;top:0;z-index:100;background:var(--bg);padding:1.5rem 0 1.25rem;margin-bottom:2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.logo{display:flex;align-items:center;gap:1.25rem}
.logo-icon{width:52px;height:52px;background:linear-gradient(148deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:var(--shadow-accent);transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.logo-icon:hover{transform:scale(1.06) rotate(-2deg)}
.brand h1{font-size:1.5rem;font-weight:800;color:var(--text);letter-spacing:-0.025em;line-height:1.2}
.brand p{font-size:0.82rem;color:var(--text2);margin-top:0.2rem;font-weight:400}
.badge-live{display:flex;align-items:center;gap:0.5rem;background:var(--green-bg);border:1px solid rgba(16,185,129,0.18);border-radius:100px;padding:0.45rem 1.1rem;font-size:0.8rem;font-weight:600;color:var(--green)}
.badge-live::before{content:'';width:7px;height:7px;background:var(--green);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.88)}}
.tabs{display:flex;gap:0.35rem;background:var(--surface);padding:0.35rem;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow);width:fit-content}
.tab{padding:0.6rem 1.6rem;border-radius:9px;border:none;background:transparent;color:var(--text2);font-size:0.875rem;font-weight:600;cursor:pointer;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);font-family:inherit}
.tab:hover{color:var(--accent);background:var(--accent-light)}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow-accent)}
.tab-content{display:none;animation:fadeUp 0.28s ease}
.tab-content.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem;margin-bottom:2.5rem}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.2rem;box-shadow:var(--shadow);transition:all 0.25s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity 0.25s}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.stat-card:hover::before{opacity:1}
.stat-card .val{font-size:2.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.03em;line-height:1;margin-bottom:0.35rem}
.stat-card .lbl{font-size:0.72rem;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.07em}
.stat-card .sub{font-size:0.75rem;color:var(--green);margin-top:0.35rem;font-weight:600}
.section-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:1.1rem;display:flex;align-items:center;gap:0.55rem}
.section-title .icon{font-size:1.2rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;margin-bottom:1.75rem;box-shadow:var(--shadow)}
.heatmap-wrap{overflow-x:auto;padding-bottom:0.5rem}
.heatmap-col-labels{display:flex;gap:4px;margin-left:116px;margin-bottom:7px}
.heatmap-col-label{width:38px;text-align:center;font-size:0.65rem;color:var(--text3);line-height:1.3;font-weight:500}
.heatmap-row{display:flex;gap:4px;align-items:center;margin-bottom:4px}
.heatmap-label{min-width:108px;font-size:0.8rem;font-weight:600;color:var(--text);text-align:right;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heatmap-cells{display:flex;gap:4px}
.heatmap-cell{width:38px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;color:#fff;flex-shrink:0;transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.15s;cursor:default}
.heatmap-cell:hover{transform:scale(1.12);box-shadow:0 4px 10px rgba(0,0,0,0.15);z-index:2;position:relative}
.heatmap-cell.up-hot{background:linear-gradient(135deg,#ef4444,#dc2626)}
.heatmap-cell.up-mid{background:linear-gradient(135deg,#f87171,#ef4444)}
.heatmap-cell.up-light{background:rgba(239,68,68,0.5)}
.heatmap-cell.down-hot{background:linear-gradient(135deg,#10b981,#059669)}
.heatmap-cell.down-mid{background:linear-gradient(135deg,#34d399,#10b981)}
.heatmap-cell.down-light{background:rgba(16,185,129,0.4)}
.heatmap-cell.none{background:var(--card2);color:var(--text3);border:1px solid var(--border2)}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:0.855rem}
th{background:var(--card2);color:var(--text2);font-weight:600;text-align:left;padding:0.85rem 1.15rem;border-bottom:1px solid var(--border);white-space:nowrap;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.07em}
td{padding:0.8rem 1.15rem;border-bottom:1px solid var(--border);vertical-align:middle;transition:background 0.12s}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-light)}
.stock-name{font-weight:600;color:var(--text)}
.stock-code{color:var(--text3);font-size:0.72rem}
.txt-up{color:var(--red);font-weight:700}
.txt-down{color:var(--green);font-weight:700}
.score-badge{display:inline-block;background:linear-gradient(135deg,var(--accent-light),rgba(129,140,248,0.08));color:var(--accent);border-radius:7px;padding:0.2rem 0.55rem;font-weight:700;font-size:0.78rem;border:1px solid rgba(91,95,214,0.12)}
.rating-stars{color:var(--yellow);letter-spacing:1.5px;font-size:0.72rem}
.day-tabs{display:flex;gap:0.4rem;margin-bottom:1.75rem;flex-wrap:wrap}
.day-tab{padding:0.5rem 1.3rem;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:0.85rem;font-weight:600;cursor:pointer;transition:all 0.18s;box-shadow:var(--shadow);font-family:inherit}
.day-tab:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.day-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:var(--accent);box-shadow:var(--shadow-accent)}
.day-tab .day-name{display:block;font-size:0.65rem;opacity:0.72;margin-top:0.1rem}
.day-report-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem;flex-wrap:wrap;gap:0.75rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.day-report-header .date{font-size:1.1rem;font-weight:800;color:var(--text)}
.day-report-header .meta{font-size:0.8rem;color:var(--text2)}
.score-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.85rem;margin-bottom:2rem}
.score-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;text-align:center;box-shadow:var(--shadow);transition:all 0.22s cubic-bezier(0.4,0,0.2,1);position:relative;overflow:hidden}
.score-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.score-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity 0.2s}
.score-card:hover::after{opacity:1}
.score-card .date{font-size:0.68rem;color:var(--text3);margin-bottom:0.4rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.score-card .score{font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.score-card .max{font-size:0.68rem;color:var(--text3);margin-top:0.15rem}
.review-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.2rem;margin-bottom:0.85rem;box-shadow:var(--shadow);transition:box-shadow 0.2s}
.review-block:hover{box-shadow:var(--shadow-md)}
.review-block .rb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.65rem}
.review-block .rb-title{font-size:0.92rem;font-weight:700;color:var(--text)}
.review-block .rb-score{font-size:1.2rem;font-weight:800;color:var(--accent)}
.review-block .rb-meta{font-size:0.8rem;color:var(--text2)}
.problem-card{background:var(--card);border:1px solid var(--border);border-left:3.5px solid var(--red);border-radius:var(--radius-sm);padding:0.95rem 1.15rem;margin-bottom:0.8rem;box-shadow:var(--shadow)}
.problem-card h4{color:var(--text);font-size:0.88rem;margin-bottom:0.3rem;font-weight:600}
.problem-card p{color:var(--text2);font-size:0.8rem}
.suggestion-card{background:var(--card);border:1px solid var(--border);border-left:3.5px solid var(--yellow);border-radius:var(--radius-sm);padding:0.95rem 1.15rem;margin-bottom:0.8rem;box-shadow:var(--shadow)}
.suggestion-card h4{color:var(--text);font-size:0.88rem;margin-bottom:0.3rem;font-weight:600}
.suggestion-card p{color:var(--text2);font-size:0.8rem}
.dim-card{background:var(--card2);border-radius:var(--radius-sm);padding:0.85rem;margin-bottom:0.6rem;border:1px solid var(--border)}
.dim-header{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;color:var(--text);font-weight:600}
.dim-meta{font-size:0.68rem;color:var(--text3);margin-top:0.3rem}
.bar-wrap{background:var(--border);border-radius:100px;height:7px;overflow:hidden;margin-top:0.55rem}
.bar{height:100%;border-radius:100px}
.idx-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:0.85rem 1rem;text-align:center;box-shadow:var(--shadow);min-width:115px}
.idx-name{font-size:0.7rem;color:var(--text3);font-weight:500}
.idx-val{font-size:1.05rem;font-weight:800;margin:0.25rem 0}
.idx-change{font-size:0.7rem;font-weight:600;font-family:monospace}
.stock-row{display:flex;justify-content:space-between;align-items:center;padding:0.42rem 0;border-bottom:1px solid var(--border);font-size:0.855rem}
.stock-row:last-child{border-bottom:none}
.loading{text-align:center;padding:4.5rem;color:var(--text2)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.85s linear infinite;margin:0 auto 1.1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.footer{margin-top:4rem;padding-top:1.75rem;border-top:1px solid var(--border);text-align:center;font-size:0.78rem;color:var(--text3)}
@media(max-width:1024px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.container{padding:1.75rem 1.25rem}.header{flex-direction:column;align-items:flex-start}.tabs{width:100%}.tab{flex:1;text-align:center;padding:0.5rem 0.5rem;font-size:0.82rem}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr 1fr;gap:0.85rem}.container{padding:1.25rem 1rem}.stat-card{padding:1rem}.stat-card .val{font-size:1.8rem}.score-cards{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo"><div class="logo-icon">📊</div><div class="brand"><h1>Stock Weekly</h1><p>周度综合看板 · 最近7天选股报告</p></div></div>
    <div class="badge-live"><span></span> 每日 9:35 / 17:00 更新</div>
  </div>
  <div class="tabs">
    <button class="tab active" id="tab-btn-overview" onclick="switchTab('overview')">📈 综合看板</button>
    <button class="tab" id="tab-btn-daily" onclick="switchTab('daily')">📋 每日报告</button>
    <button class="tab" id="tab-btn-review" onclick="switchTab('review')">🔍 周度复盘</button>
  </div>
  <div id="tab-overview" class="tab-content active">
    <div class="loading" id="overview-loading"><div class="spinner"></div><div>加载周度数据中...</div></div>
    <div id="overview-content" class="hidden">
      <div class="stats-grid" id="stats-row"></div>
      <div class="section-title"><span class="icon">🔥</span> 个股跨日热度图（Top 15）</div>
      <div class="card"><div class="heatmap-col-labels" id="heatmap-col-labels"></div><div id="heatmap-grid"></div></div>
      <div class="section-title"><span class="icon">🏆</span> 持续关注榜（出现 ≥2 天）</div>
      <div class="table-wrap"><table><thead><tr><th>#</th><th>股票</th><th>代码</th><th>出现日期</th><th>最近评级</th><th>风险</th></tr></thead><tbody id="freq-tbody"></tbody></table></div>
      <div class="section-title"><span class="icon">📂</span> 板块覆盖（近7天）</div>
      <div class="card" id="cat-bars"></div>
      <div class="section-title"><span class="icon">📅</span> 每日综评</div>
      <div id="day-summaries"></div>
    </div>
  </div>
  <div id="tab-daily" class="tab-content">
    <div class="day-tabs" id="day-tabs"></div>
    <div class="loading" id="daily-loading"><div class="spinner"></div><div>加载每日数据中...</div></div>
    <div id="daily-content" class="hidden"></div>
  </div>
  <div id="tab-review" class="tab-content">
    <div class="loading" id="review-loading"><div class="spinner"></div><div>加载复盘数据中...</div></div>
    <div id="review-content" class="hidden">
      <div class="section-title"><span class="icon">📊</span> 各日综合评分</div>
      <div class="score-cards" id="day-score-cards"></div>
      <div class="section-title"><span class="icon">📈</span> 各维度评分趋势</div>
      <div class="card" id="dim-scores"></div>
      <div id="idx-tracker"></div>
      <div id="stock-summary"></div>
      <div class="section-title" style="color:var(--red)"><span class="icon">⚠️</span> 反复出现的问题</div>
      <div id="common-problems"></div>
      <div class="section-title" style="color:var(--yellow)"><span class="icon">💡</span> 高频优化建议</div>
      <div id="common-suggestions"></div>
    </div>
  </div>
  <div id="dbg" style="position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.85);color:#0f0;font-size:11px;padding:4px 8px;border-radius:4px;z-index:9999;min-width:200px;display:block"></div>
  <div class="footer">Stock Weekly · 数据来源：公开市场信息 · 仅供参考，不构成投资建议</div>
</div>

<script>

(function(){var _p='https://raw.githubusercontent.com/';window.__src=_p+'wssaidong/AAna/main';})();
var RAW = location.hostname.includes('x-compass') ? window.__src : 'data';

var DAY_NAME_MAP={0:'周日',1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六'};
var DATES=[];
for(var di=6;di>=0;di--){
  var d=new Date();
  d.setDate(d.getDate()-di);
  DATES.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
}
var DAY_NAMES=DATES.map(function(d){var m=d.match(/(\d{4})-(\d{2})-(\d{2})/);var dt=new Date(m[1],m[2]-1,m[3]);return DAY_NAME_MAP[dt.getDay()];});
var WEEKLY_DATA={};
var SELECTED_DAY=DATES[DATES.length-1];
var ALL_LOADED=0;
var TOTAL_NEEDED=14;

function switchTab(tab){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
  document.querySelectorAll(".tab-content").forEach(function(c){c.classList.remove("active");});
  document.getElementById("tab-btn-"+tab).classList.add("active");
  document.getElementById("tab-"+tab).classList.add("active");
}

function extractEmoji(str){
  if(!str)return{emoji:"📊",name:str||""};
  var m=str.match(/^[💻📊🔧🤖🧠🔋]+/);
  return{emoji:m?m[0]:"📊",name:str.replace(/^[💻📊🔧🤖🧠🔋]+\s*/,"").trim()};
}

function parseChangeStr(str){
  if(!str)return{raw:str,dir:"neutral",val:0};
  var m=str.match(/([🟢🔴⚪])\s*([+-]?[\d.]+)%/);
  if(!m)return{raw:str,dir:"neutral",val:0};
  return{raw:str,dir:parseFloat(m[2])>=0?"up":"down",val:parseFloat(m[2])};
}

function reSafe(s){return s.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&");}

function parseReport(md,date){
  var d={date:date,top10:[],categories:{}};
  var top10m=md.match(/### 🏆 重点关注 Top 10\n\n\|[\s\S]*?\n([\s\S]*?)(?=### |## |$)/);
  if(top10m){
    top10m[1].split("\n").filter(function(l){return l.startsWith("|")&&/^\| \d/.test(l);}).forEach(function(row){
      var cells=row.split("|").slice(1,-1).map(function(c){return c.trim();});
      if(cells.length>=9){
        var ex=extractEmoji(cells[1]);
        d.top10.push({rank:cells[0],emoji:ex.emoji,name:ex.name,code:cells[2],price:cells[3],change:cells[4],tech:cells[5],score:cells[6].replace(/\*\*/g,""),rating:cells[7],risk:cells[8]});
      }
    });
  }
  var catNames=["AI算力/芯片","人形机器人","半导体设备","储能/绿电","AI应用"];
  catNames.forEach(function(catName){
    var escaped=reSafe(catName);
    var reSource="### "+escaped+"\\n[\\s\\S]*?\\n\\n\\|[^\\n]+\\|[\\s\\S]*?\\n(([\\s\\S]*?)(?=### |## |$))";
    var catM;
    try{catM=md.match(new RegExp(reSource));}catch(e){catM=null;}
    if(catM&&catM[1]){
      var stocks=[];
      catM[1].split("\n").filter(function(l){return l.startsWith("|")&&/^\| [^|]/.test(l);}).forEach(function(row){
        var cells=row.split("|").slice(1,-1).map(function(c){return c.trim();});
        if(cells.length>=7){
          var ex=extractEmoji(cells[0]);
          stocks.push({emoji:ex.emoji,name:ex.name,code:cells[1],price:cells[2],change:cells[3],tech:cells[4],score:cells[5].replace(/\*\*/g,""),rating:cells[6]});
        }
      });
      if(stocks.length)d.categories[catName]=stocks;
    }
  });
  return d;
}

function parseReview(md,date){
  var d={date:date,overallScore:null,dimScores:{},problems:[],suggestions:[]};
  var om=md.match(/\*\*综合评分[:：].*?([\d.]+)\/100/);
  if(om){d.overallScore=Math.round(parseFloat(om[1])*10/100);}
  var dims=[
    ["大盘表现",/\| 大盘表现.*?\| (\d+) \|/],
    ["赚钱效应",/\| 赚钱效应.*?\| (\d+) \|/],
    ["风险控制",/\| 风险控制.*?\| (\d+) \|/],
    ["策略执行",/\| 策略执行.*?\| (\d+) \|/]
  ];
  dims.forEach(function(item){var m=md.match(item[1]);if(m)d.dimScores[item[0]]=parseInt(m[1]);});
  var probM=md.match(/## 四、核心问题分析([\s\S]*?)(?=## 五、|## 六、|$)/);
  if(probM){
    probM[1].split(/### 问题\d+/).filter(function(b){return b.trim();}).forEach(function(block){
      var tm=block.match(/\*\*现象：\*\*(.*?)(\n|$)/);
      if(tm)d.problems.push(tm[1].trim().slice(0,120));
    });
  }
  var suggM=md.match(/## 五、优化建议([\s\S]*?)(?=## 六、|$)/);
  if(suggM){
    suggM[1].split(/### 建议\d+/).filter(function(b){return b.trim();}).forEach(function(block){
      var tm=block.match(/\*\*问题：\*\*(.*?)(\n|$)/);
      if(tm)d.suggestions.push(tm[1].trim().slice(0,120));
    });
  }
  return d;
}

function onDataLoaded(){
  ALL_LOADED++;
  if(ALL_LOADED<TOTAL_NEEDED)return;
  renderOverview();
  renderDayTabs();
  renderDayReport(SELECTED_DAY);
  renderReview();
  document.getElementById("overview-loading").classList.add("hidden");
  document.getElementById("overview-content").classList.remove("hidden");
  document.getElementById("daily-loading").classList.add("hidden");
  document.getElementById("review-loading").classList.add("hidden");
}

function renderOverview(){
  var stockMap={};
  DATES.forEach(function(dt){
    var rd=WEEKLY_DATA[dt];
    if(!rd||!rd.report)return;
    rd.report.top10.forEach(function(s){
      if(!stockMap[s.code]){stockMap[s.code]={code:s.code,name:s.name,emoji:s.emoji,days:[],ratings:[],changes:{},risk:s.risk};}
      stockMap[s.code].days.push(dt);
      stockMap[s.code].ratings.push(s.rating);
      if(s.change)stockMap[s.code].changes[dt]=s.change;
    });
  });
  var stocks=Object.values(stockMap).sort(function(a,b){return b.days.length-a.days.length;});
  var freqStocks=stocks.filter(function(s){return s.days.length>=2;});
  var top15=stocks.slice(0,15);
  var totalReports=Object.values(WEEKLY_DATA).filter(function(d){return d.report;}).length;
  var totalReviews=Object.values(WEEKLY_DATA).filter(function(d){return d.review;}).length;
  var avgScore=freqStocks.length?Math.round(freqStocks.reduce(function(s,v){return s+parseFloat(v.ratings[v.ratings.length-1]||0);},0)/freqStocks.length):0;
  document.getElementById("stats-row").innerHTML=[
    {val:totalReports,lbl:"选股报告",sub:"最近7天"},
    {val:totalReviews,lbl:"复盘评分",sub:"最近7天"},
    {val:freqStocks.length,lbl:"持续关注股",sub:"出现≥2天"},
    {val:avgScore||"—",lbl:"平均综合分",sub:freqStocks[0]?freqStocks[0].name:""},
  ].map(function(s){return'<div class="stat-card"><div class="val">'+s.val+'</div><div class="lbl">'+s.lbl+'</div>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'')+'</div>';}).join('');

  document.getElementById("heatmap-col-labels").innerHTML=DATES.map(function(dt,i){return'<div class="heatmap-col-label">'+DAY_NAMES[i]+'<br><span style="font-size:0.6rem">'+dt.slice(5)+'</span></div>';}).join('');

  var hHTML="";
  top15.forEach(function(stock){
    var cellsHTML=DATES.map(function(dt){
      var has=stock.days.indexOf(dt)>=0;
      var ch=parseChangeStr(stock.changes[dt]);
      var cls="none";
      if(has){if(ch.dir==="up")cls=ch.val>=3?"up-hot":ch.val>=1?"up-mid":"up-light";else if(ch.dir==="down")cls=ch.val<=-1?"down-hot":ch.val<=-0.5?"down-mid":"down-light";else cls="up-light";}
      var label=has?(stock.changes[dt]?stock.changes[dt].replace(/[🟢🔴⚪]/g,"").replace("%",""):"●"):"";
      return'<div class="heatmap-cell '+cls+'" title="'+(stock.name||"")+' '+(stock.changes[dt]||"")+'">'+label+'</div>';
    }).join("");
    hHTML+='<div class="heatmap-row"><div class="heatmap-label" title="'+stock.name+'">'+stock.emoji+' '+stock.name+'</div><div class="heatmap-cells">'+cellsHTML+'</div></div>';
  });
  document.getElementById("heatmap-grid").innerHTML=hHTML;

  document.getElementById("freq-tbody").innerHTML=freqStocks.map(function(s,i){
    var lastR=s.ratings[s.ratings.length-1]||"—";
    var dotsHTML=s.days.map(function(dt){
      var ch=parseChangeStr(s.changes[dt]);
      var col=ch.dir==="up"?"var(--red)":ch.dir==="down"?"var(--green)":"var(--text3)";
      return'<span class="freq-dot" style="background:'+col+'" title="'+dt+' '+(ch.raw||"")+'"></span>';
    }).join("");
    return'<tr><td>'+(i+1)+'</td><td><span>'+s.emoji+'</span> <span class="stock-name">'+s.name+'</span></td><td class="stock-code">'+s.code+'</td><td>'+dotsHTML+'</td><td><span class="rating-stars">'+lastR+'</span></td><td>'+(s.risk||"—")+'</td></tr>';
  }).join("");

  var catCount={};
  DATES.forEach(function(dt){
    var rd=WEEKLY_DATA[dt];
    if(!rd||!rd.report)return;
    Object.keys(rd.report.categories).forEach(function(cat){
      if(!catCount[cat])catCount[cat]={days:0,totalStocks:0};
      catCount[cat].days++;catCount[cat].totalStocks+=rd.report.categories[cat].length;
    });
  });
  var catColors={"AI算力/芯片":"#ef4444","人形机器人":"#f59e0b","半导体设备":"#3b82f6","储能/绿电":"#10b981","AI应用":"#8b5cf6"};
  document.getElementById("cat-bars").innerHTML=Object.entries(catCount).sort(function(a,b){return b[1].days-a[1].days;}).map(function(item){
    var cat=item[0],data=item[1];
    var pct=Math.round((data.days/7)*100);
    var col=catColors[cat]||"var(--accent)";
    return'<div class="score-row"><div class="lbl" style="width:100px">'+cat+'</div><div class="bar-wrap"><div class="bar" style="width:'+pct+'%;background:'+col+'"></div></div><div class="val" style="color:'+col+'">'+data.days+'/7 · '+data.totalStocks+'只</div></div>';
  }).join("");

  document.getElementById("day-summaries").innerHTML=DATES.slice().reverse().map(function(dt){
    var rd=WEEKLY_DATA[dt];
    if(!rd||!rd.report)return"";
    var top3=rd.report.top10.slice(0,3).map(function(s){return s.emoji+" "+s.name;}).join(" · ");
    var score=rd.review?rd.review.overallScore:"—";
    return'<div class="review-block"><div class="rb-header"><div class="rb-title">'+dt+' ('+DAY_NAMES[DATES.indexOf(dt)]+')</div><div class="rb-score">'+score+'/10'+(rd.review&&rd.review.overallScore?'':' <span style="font-size:0.7rem;color:var(--muted)">暂无评分</span>')+'</div></div><div class="rb-meta"><strong>Top：</strong>'+top3+'</div></div>';
  }).join("");
}

function renderDayTabs(){
  document.getElementById("day-tabs").innerHTML=DATES.slice().reverse().map(function(dt){
    return'<button class="day-tab'+(dt===SELECTED_DAY?' active':'')+'" onclick="selectDay(\''+dt+'\')"><span class="day-name">'+dt.slice(5)+'</span>'+DAY_NAMES[DATES.indexOf(dt)]+'</button>';
  }).join("");
}

function selectDay(dt){
  SELECTED_DAY=dt;
  document.querySelectorAll(".day-tab").forEach(function(t){t.classList.remove("active");});
  document.querySelector(".day-tab[onclick*='"+dt+"']").classList.add("active");
  renderDayReport(dt);
}

function renderDayReport(dt){
  var rd=WEEKLY_DATA[dt];
  if(!rd||!rd.report){document.getElementById("daily-content").innerHTML="<div class='loading'>该日期暂无数据</div>";return;}
  var r=rd.report;
  var cats=Object.keys(r.categories||{});
  var html='<div class="day-report-header"><div><div class="date">'+dt+' 选股报告</div><div class="meta">Stock Weekly · 仅供参考不构成投资建议</div></div>';
  if(rd.review&&rd.review.overallScore)html+='<span class="score-badge" style="font-size:0.85rem;padding:0.3rem 0.8rem">复盘 '+rd.review.overallScore+'/10</span>';
  html+='</div>';
  html+='<div class="section-title">🏆 Top 10</div><div class="stock-table-wrap"><table class="stock-table"><thead><tr><th>#</th><th>股票</th><th>代码</th><th>价格</th><th>涨跌幅</th><th>技</th><th>综</th><th>评级</th><th>风险</th></tr></thead><tbody>';
  r.top10.forEach(function(s){
    var ch=parseChangeStr(s.change);
    var cls=ch.dir==="up"?"up":ch.dir==="down"?"down":"";
    html+='<tr><td>'+s.rank+'</td><td><span>'+s.emoji+'</span> <span class="stock-name">'+s.name+'</span></td><td class="stock-code">'+s.code+'</td><td>'+s.price+'</td><td class="'+cls+'">'+(ch.raw||"")+'</td><td>'+s.tech+'</td><td><span class="score-badge">'+s.score+'</span></td><td><span class="rating-stars">'+s.rating+'</span></td><td>'+s.risk+'</td></tr>';
  });
  html+='</tbody></table></div>';
  cats.forEach(function(cat){
    var cs=r.categories[cat];if(!cs||!cs.length)return;
    html+='<div class="section-title" style="margin-top:1.5rem">'+cat+'</div><div class="stock-table-wrap"><table class="stock-table"><thead><tr><th>股票</th><th>代码</th><th>价格</th><th>涨跌幅</th><th>技</th><th>综</th><th>评级</th></tr></thead><tbody>';
    cs.forEach(function(s){
      var ch=parseChangeStr(s.change);
      var cls=ch.dir==="up"?"up":ch.dir==="down"?"down":"";
      html+='<tr><td><span>'+s.emoji+'</span> <span class="stock-name">'+s.name+'</span></td><td class="stock-code">'+s.code+'</td><td>'+s.price+'</td><td class="'+cls+'">'+(ch.raw||"")+'</td><td>'+s.tech+'</td><td><span class="score-badge">'+s.score+'</span></td><td><span class="rating-stars">'+s.rating+'</span></td></tr>';
    });
    html+='</tbody></table></div>';
  });
  if(rd.review){
    var rv=rd.review;
    html+='<div class="section-title" style="margin-top:1.5rem">🔍 复盘 '+dt+'</div><div class="review-block"><div class="rb-header"><div class="rb-title">综合评分</div><div class="rb-score">'+(rv.overallScore||"—")+'/10</div></div>';
    if(rv.dimScores&&Object.keys(rv.dimScores).length){
      var dimColors={"大盘判断":"#ef4444","热点方向命中率":"#f59e0b","推荐个股表现":"#3b82f6","操作建议有效性":"#8b5cf6","风险提示准确性":"#10b981"};
      html+='<div style="margin-top:0.8rem">';
      Object.entries(rv.dimScores).forEach(function(kv){
        var color=dimColors[kv[0]]||"var(--accent)";
        html+='<div class="score-row"><div class="lbl">'+kv[0]+'</div><div class="bar-wrap"><div class="bar" style="width:'+Math.round((kv[1]/10)*100)+'%;background:'+color+'"></div></div><div class="val" style="color:'+color+'">'+kv[1]+'/10</div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  }
  document.getElementById("daily-content").innerHTML=html;
  document.getElementById("daily-content").classList.remove("hidden");
}

function renderReview(){
  var allProblems={};
  var allSuggestions={};
  var dimAll={大盘判断:[],热点方向命中率:[],推荐个股表现:[],操作建议有效性:[],风险提示准确性:[]};
  var dayScores=[];
  DATES.forEach(function(dt){
    var rd=WEEKLY_DATA[dt];
    if(!rd||!rd.review)return;
    var rv=rd.review;
    if(rv.overallScore)dayScores.push({date:dt,score:rv.overallScore});
    if(rv.problems)rv.problems.forEach(function(p){if(!allProblems[p])allProblems[p]=0;allProblems[p]++;});
    if(rv.suggestions)rv.suggestions.forEach(function(s){if(!allSuggestions[s])allSuggestions[s]=0;allSuggestions[s]++;});
    Object.keys(dimAll).forEach(function(k){
      if(rv.dimScores&&rv.dimScores[k]!=null)dimAll[k].push({date:dt,val:rv.dimScores[k]});
    });
  });

  document.getElementById("day-score-cards").innerHTML=dayScores.map(function(d){
    return'<div class="day-score-card"><div class="date">'+
    d.date.slice(5)+'</div><div class="score">'+d.score+'</div><div class="max">/10</div></div>';
  }).join('');
  if(dayScores.length){
    var avgOverall=dayScores.reduce(function(s,v){return s+v.score;},0)/dayScores.length;
    document.getElementById('day-score-cards').innerHTML+='<div class="day-score-card" style="border-color:var(--accent)"><div class="date">平均</div><div class="score">'+avgOverall.toFixed(1)+'</div><div class="max">/10</div></div>';
  }

  var dimColors={"大盘判断":"#ef4444","热点方向命中率":"#f59e0b","推荐个股表现":"#3b82f6","操作建议有效性":"#8b5cf6","风险提示准确性":"#10b981"};
  var dimHTML='';
  Object.entries(dimAll).filter(function(kv){return kv[1].length>0;}).forEach(function(kv){
    var k=kv[0],vals=kv[1];
    var avg=vals.reduce(function(s,v){return s+v.val;},0)/vals.length;
    var color=dimColors[k]||"var(--accent)";
    dimHTML+='<div class="score-row"><div class="lbl">'+k+'</div><div class="bar-wrap"><div class="bar" style="width:'+Math.round((avg/10)*100)+'%;background:'+color+'"></div></div><div class="val" style="color:'+color+'">'+avg.toFixed(1)+'/10</div></div>';
  });
  document.getElementById('dim-scores').innerHTML=dimHTML;

  var probList=Object.entries(allProblems).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  document.getElementById('common-problems').innerHTML=probList.map(function(item){
    return'<div class="problem-card"><h4>⚠️ '+item[0]+'</h4><p>出现 '+item[1]+' 次</p></div>';
  }).join('');

  var suggList=Object.entries(allSuggestions).sort(function(a,b){return b[1]-a[1];}).slice(0,5);
  document.getElementById('common-suggestions').innerHTML=suggList.map(function(item){
    return'<div class="suggestion-card"><h4>💡 '+item[0]+'</h4><p>出现 '+item[1]+' 次</p></div>';
  }).join('');

  document.getElementById('review-content').classList.remove('hidden');
}

// Load all data - sequential with retry and rate-limit backoff
(function loadAll(){
  var dbg=document.getElementById('dbg');
  var idx=0;
  function loadNext(){
    if(idx>=DATES.length){
      if(dbg)dbg.textContent+=' | 加载完成';
      return;
    }
    var dt=DATES[idx++];
    WEEKLY_DATA[dt]={};
    if(dbg)dbg.textContent='加载: '+dt+' ('+idx+'/'+DATES.length+')';
    function fetchWithRetry(url,type,retries){
      return fetch(url).then(function(r){
        if(!r.ok&&r.status===429&&retries>0){
          if(dbg)dbg.textContent+=' | '+type+' 限流重试';
          return new Promise(function(res){setTimeout(function(){res(fetchWithRetry(url,type,retries-1));},600*(4-retries));});
        }
        if(dbg)dbg.textContent+=' | '+type+':'+r.status;
        return r.ok?r.text():null;
      }).catch(function(e){
        if(retries>0){
          if(dbg)dbg.textContent+=' | '+type+' err重试';
          return new Promise(function(res){setTimeout(function(){res(fetchWithRetry(url,type,retries-1));},400);});
        }
        if(dbg)dbg.textContent+=' | '+type+' err:'+e.message;
        return null;
      });
    }
    fetchWithRetry(RAW+"/"+dt+"-%E9%80%89%E8%82%A1%E6%8A%A5%E5%91%8A.md",'选股',3).then(function(md){
      if(md){WEEKLY_DATA[dt].report=parseReport(md,dt);}
      onDataLoaded();
      fetchWithRetry(RAW+"/"+dt+"-%E5%A4%8D%E7%9B%98%E8%AF%84%E5%88%86.md",'复盘',3).then(function(md2){
        if(md2){WEEKLY_DATA[dt].review=parseReview(md2,dt);}
        onDataLoaded();
        setTimeout(loadNext,180);
      });
    });
  }
  loadNext();
})();

</script>
